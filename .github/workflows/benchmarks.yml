name: Benchmark

on:
  schedule:
    - cron: "0 5 * * 1" # settimanale
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  criterion:
    name: Criterion (firma, pipeline, persistenza, export)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Benchmark
        run: |
          cargo bench --workspace -- --warm-up-time 1 --measurement-time 5
      - name: Pubblica report
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report
          path: target/criterion/
          retention-days: 30
