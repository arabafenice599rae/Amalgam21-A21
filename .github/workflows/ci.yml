name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  fmt-check:
    name: rustfmt (verifica)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Verifica formato
        run: cargo fmt --all -- --check

  fmt-fix:
    name: rustfmt (autofix)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatta
        run: cargo fmt --all
      - name: Commit e push se vi sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fmt: normalizzazione rustfmt [skip ci]"
            git push
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint (warning come errori)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee diag.log
      - name: Pubblica diagnostica su ramo dati
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="diag/clippy"
          git switch -c "$BRANCH"
          mkdir -p diag
          {
            echo "commit: ${{ github.sha }}"
            echo "job: ${{ github.job }}"
            echo "run: ${{ github.run_id }}"
            echo
            tail -n 200 diag.log
          } > "diag/clippy.log"
          git add diag
          git commit -m "diag: clippy @ ${{ github.sha }} [skip ci]"
          git push origin "$BRANCH"

  build-test:
    name: build e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cargo build --workspace --all-targets 2>&1 | tee diag.log
      - name: Test
        if: success()
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee diag-test.log
      - name: Pubblica diagnostica su ramo dati
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="diag/build-test"
          git switch -c "$BRANCH"
          mkdir -p diag
          {
            echo "commit: ${{ github.sha }}"
            echo "job: ${{ github.job }}"
            echo "run: ${{ github.run_id }}"
            echo
            tail -n 200 diag.log 2>/dev/null; echo ----; tail -n 100 diag-test.log 2>/dev/null
          } > "diag/build-test.log"
          git add diag
          git commit -m "diag: build-test @ ${{ github.sha }} [skip ci]"
          git push origin "$BRANCH"

  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Installazione cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Lockfile per la verifica
        run: cargo generate-lockfile
      - name: Analisi vulnerabilita'
        run: cargo audit
