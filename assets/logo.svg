<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Amalgam21 logo">
  <defs>
    <linearGradient id="a21" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" rx="36" fill="#0B1220"/>
  <rect width="240" height="240" rx="36" fill="url(#glow)"/>

  <!-- outer hexagon -->
  <polygon points="120,18 210.1,70 210.1,170 120,222 29.9,170 29.9,70"
           fill="none" stroke="url(#a21)" stroke-width="6" stroke-linejoin="round"/>
  <!-- inner hexagon -->
  <polygon points="120,34 196.2,78 196.2,162 120,206 43.8,162 43.8,78"
           fill="none" stroke="url(#a21)" stroke-width="1.5" opacity="0.35"/>

  <!-- ledger lattice: nodes on hexagon vertices linked to the core -->
  <g stroke="#22D3EE" stroke-width="1.2" opacity="0.45">
    <line x1="120" y1="18"  x2="120" y2="120"/>
    <line x1="210.1" y1="70"  x2="120" y2="120"/>
    <line x1="210.1" y1="170" x2="120" y2="120"/>
    <line x1="120" y1="222" x2="120" y2="120"/>
    <line x1="29.9" y1="170" x2="120" y2="120"/>
    <line x1="29.9" y1="70"  x2="120" y2="120"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="120" cy="18"  r="4.5"/>
    <circle cx="210.1" cy="70"  r="4.5"/>
    <circle cx="210.1" cy="170" r="4.5"/>
    <circle cx="120" cy="222" r="4.5"/>
    <circle cx="29.9" cy="170" r="4.5"/>
    <circle cx="29.9" cy="70"  r="4.5"/>
  </g>

  <!-- core -->
  <text x="120" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="2" fill="url(#a21)">A21</text>
  <text x="120" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11.5" letter-spacing="4.5" fill="#7DD3FC" opacity="0.85">AMALGAM21</text>
</svg>
