
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024"
     viewBox="0 0 1024 1024"
     role="img"
     aria-labelledby="title desc">

  <title id="title">AMALGAM21 — A21 Quantum Core</title>
  <desc id="desc">Identità tecnologica A21 con nucleo centrale, geometria esagonale e circuiti luminosi.</desc>

  <defs>
    <radialGradient id="bg">
      <stop offset="0%" stop-color="#101d42"/>
      <stop offset="65%" stop-color="#050a20"/>
      <stop offset="100%" stop-color="#01030d"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#42f5ff"/>
      <stop offset="45%" stop-color="#087dff"/>
      <stop offset="100%" stop-color="#713cff"/>
    </linearGradient>

    <linearGradient id="letter" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#65faff"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Outer orbital rings -->
  <g fill="none" stroke="#0757b9" opacity=".45">
    <circle cx="512" cy="460" r="360" stroke-width="2"/>
    <circle cx="512" cy="460" r="330"
            stroke-width="1" stroke-dasharray="8 15"/>
    <circle cx="512" cy="460" r="285"
            stroke-width="1.5"/>
  </g>

  <!-- Hexagonal architecture -->
  <g fill="none" stroke="url(#metal)"
     stroke-width="4" filter="url(#softGlow)">

    <path d="M512 115 L810 285 L810 635
             L512 805 L214 635 L214 285 Z"/>

    <path d="M512 165 L765 310 L765 610
             L512 755 L259 610 L259 310 Z"
          opacity=".55"/>

    <path d="M512 215 L720 335 L720 585
             L512 705 L304 585 L304 335 Z"
          opacity=".35"/>
  </g>

  <!-- Internal connections -->
  <g fill="none" stroke="#087dff"
     stroke-width="2.5" opacity=".7">

    <path d="M512 115 L512 280 L360 365"/>
    <path d="M810 285 L665 365 L512 280"/>
    <path d="M810 635 L665 555 L512 640"/>
    <path d="M512 805 L512 640 L360 555"/>
    <path d="M214 635 L360 555 L360 365"/>
    <path d="M214 285 L360 365 L512 460"/>
    <path d="M259 310 L512 460 L765 310"/>
    <path d="M259 610 L512 460 L765 610"/>
    <path d="M360 365 L512 640"/>
    <path d="M665 365 L512 640"/>
    <path d="M360 555 L665 365"/>
    <path d="M665 555 L360 365"/>
  </g>

  <!-- Circuit paths -->
  <g fill="none" stroke="#00d9ff"
     stroke-width="3" stroke-linecap="round">

    <path d="M512 115 V75 H440"/>
    <path d="M810 285 H875 V350"/>
    <path d="M810 635 H875 V570"/>
    <path d="M512 805 V860 H585"/>
    <path d="M214 635 H150 V570"/>
    <path d="M214 285 H150 V350"/>
  </g>

  <!-- Circuit terminals -->
  <g fill="#21eaff" filter="url(#glow)">
    <circle cx="440" cy="75" r="8"/>
    <circle cx="875" cy="350" r="8"/>
    <circle cx="875" cy="570" r="8"/>
    <circle cx="585" cy="860" r="8"/>
    <circle cx="150" cy="570" r="8"/>
    <circle cx="150" cy="350" r="8"/>
    <circle cx="512" cy="115" r="9"/>
    <circle cx="810" cy="285" r="9"/>
    <circle cx="810" cy="635" r="9"/>
    <circle cx="512" cy="805" r="9"/>
    <circle cx="214" cy="635" r="9"/>
    <circle cx="214" cy="285" r="9"/>
  </g>

  <!-- Central energy core -->
  <g filter="url(#glow)">
    <circle cx="512" cy="460" r="185"
            fill="#071a3c" opacity=".8"/>
    <circle cx="512" cy="460" r="175"
            fill="none" stroke="#00cfff"
            stroke-width="3" opacity=".7"/>
    <circle cx="512" cy="460" r="155"
            fill="none" stroke="#375cff"
            stroke-width="2" opacity=".65"/>
  </g>

  <!-- A21 central typography -->
  <g fill="url(#letter)"
     font-family="Arial, Helvetica, sans-serif"
     font-weight="bold"
     text-anchor="middle">

    <text x="512" y="510"
          font-size="145"
          letter-spacing="-9"
          filter="url(#softGlow)">A21</text>
  </g>

  <!-- Central core detail -->
  <path d="M440 535 H584"
        stroke="#00eaff"
        stroke-width="3"
        opacity=".8"
        filter="url(#softGlow)"/>

  <!-- Brand name -->
  <text x="512" y="925"
        fill="#e8faff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="37"
        font-weight="600"
        letter-spacing="12"
        text-anchor="middle">AMALGAM21</text>

  <text x="512" y="965"
        fill="#168bff"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        letter-spacing="7"
        text-anchor="middle">DECENTRALIZED DIGITAL TECHNOLOGY</text>

</svg>
