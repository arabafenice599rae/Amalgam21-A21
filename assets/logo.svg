<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Amalgam21 logo">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#00FFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00FFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nodeline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <!-- sfondo nero pieno con bagliore centrale -->
  <rect width="240" height="240" fill="#000000"/>
  <rect width="240" height="240" fill="url(#glow)"/>

  <!-- reticolo pentagonale -->
  <g stroke="url(#nodeline)" stroke-width="1.4" opacity="0.85" fill="none">
    <!-- perimetro pentagonale -->
    <polygon points="120,26 200.4,84.2 169.8,178.3 70.2,178.3 39.6,84.2"/>
    <!-- connessioni interne -->
    <line x1="120" y1="26"  x2="120" y2="120"/>
    <line x1="120" y1="26"  x2="70.2" y2="178.3"/>
    <line x1="200.4" y1="84.2"  x2="120" y2="120"/>
    <line x1="200.4" y1="84.2"  x2="70.2" y2="178.3"/>
    <line x1="169.8" y1="178.3" x2="120" y2="120"/>
    <line x1="70.2" y1="178.3" x2="120" y2="120"/>
    <line x1="39.6" y1="84.2"  x2="120" y2="120"/>
    <line x1="39.6" y1="84.2"  x2="169.8" y2="178.3"/>
    <line x1="70.2" y1="178.3" x2="169.8" y2="178.3"/>
  </g>

  <!-- nodi -->
  <g>
    <circle cx="120" cy="26"  r="6" fill="#00BFFF"/>
    <circle cx="200.4" cy="84.2"  r="5" fill="#3B82F6"/>
    <circle cx="169.8" cy="178.3" r="6" fill="#1E40AF"/>
    <circle cx="70.2" cy="178.3" r="5" fill="#2563EB"/>
    <circle cx="39.6" cy="84.2"  r="6" fill="#00BFFF"/>
    <circle cx="120" cy="120" r="4" fill="#60A5FA"/>
  </g>

  <!-- nucleo A21 con bagliore -->
  <g filter="url(#softglow)">
    <text x="120" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="2" fill="#00FFFF">A21</text>
  </g>
  <text x="120" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="11.5" letter-spacing="4.5" fill="#00BFFF" opacity="0.85">AMALGAM21</text>
</svg>
