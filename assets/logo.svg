
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="768"
     viewBox="0 0 1024 768"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Amalgam21 - A21</title>
  <desc id="desc">Logo A21 con rete geometrica blu e scritta ciano luminosa.</desc>

  <defs>
    <radialGradient id="background" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#03091d"/>
      <stop offset="100%" stop-color="#00000b"/>
    </radialGradient>

    <linearGradient id="network" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0759df"/>
      <stop offset="50%" stop-color="#063a9d"/>
      <stop offset="100%" stop-color="#087dff"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35f5ff"/>
      <stop offset="100%" stop-color="#00c8ff"/>
    </linearGradient>

    <filter id="blueGlow" x="-250%" y="-250%" width="600%" height="600%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="768" fill="url(#background)"/>

  <!-- Geometric network -->
  <g fill="none"
     stroke="url(#network)"
     stroke-width="1.8"
     opacity="0.56">

    <path d="M513 130 L292 254 L292 514 L512 627 L734 514 L734 254 Z"/>

    <path d="M513 130 L445 186 L362 250 L292 254"/>
    <path d="M513 130 L512 196 L664 251 L734 254"/>

    <path d="M292 254 L321 309 L289 352 L328 452 L292 514"/>
    <path d="M734 254 L700 315 L707 421 L669 503 L734 514"/>

    <path d="M362 250 L413 265 L512 196 L588 243 L664 251"/>
    <path d="M321 309 L378 357 L328 452 L364 508 L456 580 L512 627"/>
    <path d="M700 315 L644 356 L707 421 L669 503 L571 538 L512 627"/>

    <path d="M292 514 L364 508 L512 557 L669 503 L734 514"/>

    <path d="M445 186 L413 265 L378 357 L328 452"/>
    <path d="M512 196 L548 286 L644 356 L707 421"/>

    <path d="M362 250 L512 250 L664 251"/>
    <path d="M321 309 L512 390 L700 315"/>
    <path d="M289 352 L512 390 L707 421"/>
    <path d="M328 452 L512 390 L669 503"/>
    <path d="M364 508 L512 480 L669 503"/>

    <path d="M413 265 L512 250 L588 243"/>
    <path d="M378 357 L512 480 L571 538"/>
    <path d="M548 286 L512 390 L512 557"/>
    <path d="M456 580 L512 557 L571 538"/>
  </g>

  <!-- Bright connections -->
  <g fill="none"
     stroke="#087bff"
     stroke-width="2.2"
     opacity="0.78">

    <path d="M445 186 L362 250 L321 309"/>
    <path d="M512 196 L445 314"/>
    <path d="M664 251 L700 315"/>
    <path d="M292 254 L328 452 L364 508"/>
    <path d="M734 254 L707 421 L669 503"/>
    <path d="M364 508 L512 627"/>
    <path d="M512 557 L512 627"/>
  </g>

  <!-- Network nodes -->
  <g filter="url(#blueGlow)">

    <g fill="#087cff">
      <circle cx="513" cy="130" r="10"/>
      <circle cx="292" cy="254" r="10"/>
      <circle cx="734" cy="254" r="10"/>
      <circle cx="292" cy="514" r="10"/>
      <circle cx="734" cy="514" r="10"/>
      <circle cx="362" cy="250" r="9"/>
      <circle cx="664" cy="251" r="8"/>
      <circle cx="669" cy="503" r="8"/>
    </g>

    <g fill="#00cfff">
      <circle cx="445" cy="186" r="7"/>
      <circle cx="512" cy="196" r="9"/>
      <circle cx="700" cy="315" r="8"/>
      <circle cx="328" cy="452" r="8"/>
      <circle cx="364" cy="508" r="8"/>
      <circle cx="512" cy="557" r="8"/>
      <circle cx="512" cy="627" r="10"/>
    </g>

    <g fill="#0860c8">
      <circle cx="321" cy="309" r="7"/>
      <circle cx="289" cy="352" r="6"/>
      <circle cx="413" cy="265" r="6"/>
      <circle cx="588" cy="243" r="4"/>
      <circle cx="707" cy="421" r="7"/>
      <circle cx="456" cy="580" r="7"/>
      <circle cx="571" cy="538" r="4"/>
    </g>
  </g>

  <!-- Central A21 logo -->
  <text x="512"
        y="430"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="158"
        font-weight="500"
        letter-spacing="-8"
        fill="url(#cyan)"
        filter="url(#cyanGlow)">A21</text>

  <!-- Stylized A accent -->
  <path d="M400 418 L435 324 L466 324 L431 418"
        fill="none"
        stroke="#28efff"
        stroke-width="7"
        stroke-linecap="round"
        opacity="0.95"/>

</svg>
