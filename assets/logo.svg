<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Amalgam21 logo">
  <defs>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#00E5FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="240" height="240" fill="#000000"/>
  <rect width="240" height="240" fill="url(#halo)"/>

  <!-- reticolo: 18 nodi -->
  <g stroke="#38BDF8" stroke-width="1.1" fill="none">
    <!-- anello esterno -->
    <line x1="120" y1="12"  x2="180" y2="48"/>
    <line x1="180" y1="48"  x2="216" y2="108"/>
    <line x1="216" y1="108" x2="180" y2="168"/>
    <line x1="180" y1="168" x2="120" y2="204"/>
    <line x1="120" y1="204" x2="72"  y2="168"/>
    <line x1="72"  y1="168" x2="24"  y2="108"/>
    <line x1="24"  y1="108" x2="60"  y2="48"/>
    <line x1="60"  y1="48"  x2="96"  y2="12"/>
    <line x1="96"  y1="12"  x2="120" y2="12"/>
    <!-- incroci interni verso il nucleo -->
    <line x1="120" y1="12"  x2="120" y2="120"/>
    <line x1="216" y1="108" x2="120" y2="120"/>
    <line x1="120" y1="204" x2="120" y2="120"/>
    <line x1="24"  y1="108" x2="120" y2="120"/>
    <line x1="180" y1="48"  x2="120" y2="120" opacity="0.6"/>
    <line x1="180" y1="168" x2="120" y2="120" opacity="0.6"/>
    <line x1="60"  y1="48"  x2="120" y2="120" opacity="0.6"/>
    <line x1="72"  y1="168" x2="120" y2="120" opacity="0.6"/>
    <line x1="96"  y1="12"  x2="144" y2="78"  opacity="0.45"/>
    <line x1="216" y1="108" x2="144" y2="150" opacity="0.45"/>
    <line x1="120" y1="204" x2="96"  y2="150" opacity="0.45"/>
    <line x1="24"  y1="108" x2="96"  y2="78"  opacity="0.45"/>
    <!-- anello interno -->
    <line x1="120" y1="60"  x2="168" y2="84"/>
    <line x1="168" y1="84"  x2="144" y2="150"/>
    <line x1="144" y1="150" x2="96"  y2="150"/>
    <line x1="96"  y1="150" x2="72"  y2="84"/>
    <line x1="72"  y1="84"  x2="120" y2="60"/>
    <!-- nodi intermedi -->
    <line x1="150" y1="42"  x2="168" y2="84" opacity="0.4"/>
    <line x1="192" y1="138" x2="144" y2="150" opacity="0.4"/>
    <line x1="48"  y1="138" x2="96"  y2="150" opacity="0.4"/>
    <line x1="90"  y1="42"  x2="72"  y2="84"  opacity="0.4"/>
    <line x1="150" y1="42"  x2="120" y2="60"  opacity="0.4"/>
    <line x1="90"  y1="42"  x2="120" y2="60"  opacity="0.4"/>
    <line x1="192" y1="138" x2="168" y2="84"  opacity="0.4"/>
    <line x1="48"  y1="138" x2="72"  y2="84"  opacity="0.4"/>
    <!-- nodi interni verso il centro -->
    <line x1="144" y1="78"  x2="120" y2="120" opacity="0.5"/>
    <line x1="96"  y1="78"  x2="120" y2="120" opacity="0.5"/>
    <line x1="144" y1="150" x2="120" y2="120" opacity="0.35"/>
    <line x1="96"  y1="150" x2="120" y2="120" opacity="0.35"/>
  </g>

  <!-- nodi -->
  <g fill="#7DD3FC">
    <!-- anello esterno -->
    <circle cx="120" cy="12"  r="5"/>
    <circle cx="180" cy="48"  r="4.5"/>
    <circle cx="216" cy="108" r="5"/>
    <circle cx="180" cy="168" r="4.5"/>
    <circle cx="120" cy="204" r="5"/>
    <circle cx="72"  cy="168" r="4.5"/>
    <circle cx="24"  cy="108" r="5"/>
    <circle cx="60"  cy="48"  r="4.5"/>
    <circle cx="96"  cy="12"  r="4.5"/>
    <!-- intermedi -->
    <circle cx="150" cy="42"  r="3.5" opacity="0.9"/>
    <circle cx="192" cy="138" r="3.5" opacity="0.9"/>
    <circle cx="48"  cy="138" r="3.5" opacity="0.9"/>
    <circle cx="90"  cy="42"  r="3.5" opacity="0.9"/>
    <!-- anello interno -->
    <circle cx="120" cy="60"  r="4"/>
    <circle cx="168" cy="84"  r="4"/>
    <circle cx="144" cy="150" r="4" opacity="0.85"/>
    <circle cx="96"  cy="150" r="4" opacity="0.85"/>
    <circle cx="72"  cy="84"  r="4"/>
    <!-- nodi in incrocio con alone -->
    <circle cx="144" cy="78"  r="3.2" filter="url(#softglow)"/>
    <circle cx="96"  cy="78"  r="3.2" filter="url(#softglow)"/>
  </g>

  <!-- nucleo A21 -->
  <g filter="url(#softglow)">
    <text x="120" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
          font-size="60" font-weight="700" letter-spacing="2" fill="#00E5FF">A21</text>
  </g>
</svg>
